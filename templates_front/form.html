{% extends "base.html" %}
{% block title %}{{ titulo }} | Controle RFID{% endblock %}
{% block content %}
<section class="cabecalho-pagina"><div><h1>{{ titulo }}</h1><p>Os dados serão enviados à API. O cartão RFID é associado em uma segunda chamada.</p></div></section>
<form class="cartao formulario" method="post">
  <label for="nome">Nome completo *
    <input id="nome" name="nome" required maxlength="120" value="{{ colaborador.nome if colaborador else '' }}">
  </label>
  <label for="matricula">Matrícula *
    <input id="matricula" name="matricula" required maxlength="50" value="{{ colaborador.matricula if colaborador else '' }}" placeholder="Ex.: MAT004">
  </label>
  <label for="funcao">Função *
    <input id="funcao" name="funcao" required maxlength="100" value="{{ colaborador.funcao if colaborador else '' }}" placeholder="Ex.: Técnico">
  </label>
  <label for="tag_rfid">ID do cartão RFID (UID) *
    <input id="tag_rfid" name="tag_rfid" required maxlength="100" value="{{ colaborador.tag_rfid if colaborador else '' }}" placeholder="UID lido pelo leitor RFID">
    <small>O cartão será registrado pela rota POST /cartoes depois do cadastro do colaborador.</small>
  </label>
  <label for="autorizado">Permissão de acesso
    <select id="autorizado" name="autorizado">
      <option value="1" {% if colaborador and colaborador.autorizado|string == '1' %}selected{% endif %}>Autorizado</option>
      <option value="0" {% if not colaborador or colaborador.autorizado|string != '1' %}selected{% endif %}>Não autorizado</option>
    </select>
  </label>
  <div class="botoes-form">
    <button class="botao principal" type="submit">Cadastrar</button>
    <a class="botao secundario" href="{{ url_for('index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
